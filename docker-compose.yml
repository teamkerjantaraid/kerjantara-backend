version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: kerjantara
      POSTGRES_USER: kerjantara
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://kerjantara:localdevpassword@postgres:5432/kerjantara?sslmode=disable
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadminpassword
      SUPABASE_STORAGE_BUCKET: kerjantara
      JWT_SECRET: super-secret-key-that-is-at-least-32-chars-long
      MIDTRANS_SERVER_KEY: SB-Mid-server-xxxx
      APP_PORT: 8080
      RESPONSE_WINDOW_MINUTES: 15
      GPS_TOLERANCE_METERS: 50
      CORS_ALLOWED_ORIGIN: "*"
    depends_on:
      - postgres
      - minio

volumes:
  pgdata:
  miniodata:
